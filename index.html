<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>مدیریت ساختمان</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap"
    rel="stylesheet"
  >

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --tile: #004759;
      --tile-2: #006289;
      --saffron: #e84a00;
      --brick: #bb1d2c;
      --plum: #661f66;

      --paper: #fbf8f5;
      --card: #ffffff;
      --line: #e9e1da;
      --ink: #2b2420;
      --muted: #7a6c63;

      --ok: #0f7a5a;
      --ok-bg: #e3f4ed;

      --warn: #b54700;
      --warn-bg: #fdeee4;

      --bad: #bb1d2c;
      --bad-bg: #fbe6e8;

      --r: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Vazirmatn, Tahoma, sans-serif;
      font-size: 15px;
      line-height: 1.7;
    }

    body {
      min-height: 100vh;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: var(--tile-2);
    }

    .hidden {
      display: none !important;
    }

    /* ---------------- HEADER ---------------- */

    header.top {
      background: var(--tile);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .top-in {
      max-width: 1180px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      flex-wrap: wrap;
    }

    .brand {
      font-weight: 900;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand i {
      width: 12px;
      height: 28px;
      background: var(--saffron);
      border-radius: 3px;
      display: inline-block;
    }

    nav.tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      flex: 1;
    }

    nav.tabs button {
      background: transparent;
      border: 0;
      color: #cfe3e8;
      padding: 7px 14px;
      border-radius: 99px;
      font-weight: 500;
    }

    nav.tabs button:hover {
      background: rgba(255,255,255,.12);
    }

    nav.tabs button.on {
      background: #fff;
      color: var(--tile);
      font-weight: 700;
    }

    .who {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #cfe3e8;
    }

    .who b {
      color: #fff;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid rgba(255,255,255,.35);
      color: #fff;
      border-radius: 99px;
      padding: 5px 14px;
    }

    .btn-ghost:hover {
      background: rgba(255,255,255,.1);
    }

    /* ---------------- MAIN ---------------- */

    main {
      max-width: 1180px;
      margin: auto;
      padding: 24px 20px 80px;
    }

    h1 {
      font-size: 30px;
      font-weight: 900;
      margin: 0 0 4px;
    }

    h2 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 12px;
    }

    .sub {
      color: var(--muted);
      margin: 0 0 20px;
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .spread {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 20px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .g2 {
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }

    .g3 {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    label.f {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 14px;
      color: var(--muted);
    }

    input,
    select,
    textarea {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 9px 12px;
      min-height: 42px;
      width: 100%;
    }

    textarea {
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid var(--tile-2);
      outline-offset: -1px;
      border-color: transparent;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 700;
      background: var(--tile);
      color: #fff;
      min-height: 42px;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--tile-2);
    }

    .btn.sf {
      background: var(--saffron);
    }

    .btn.lt {
      background: #eef3f4;
      color: var(--tile);
    }

    .btn.rd {
      background: var(--bad-bg);
      color: var(--bad);
    }

    .btn.sm {
      padding: 5px 12px;
      min-height: 32px;
      font-size: 14px;
      border-radius: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 99px;
      padding: 1px 10px;
      font-size: 14px;
      font-weight: 700;
    }

    .chip.ok {
      background: var(--ok-bg);
      color: var(--ok);
    }

    .chip.no {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .chip.ex {
      background: #efeae6;
      color: var(--muted);
    }

    .chip.pd {
      background: #ece4f3;
      color: var(--plum);
    }

    .num {
      font-feature-settings: "tnum";
      white-space: nowrap;
    }

    .neg {
      color: var(--bad);
    }

    .muted {
      color: var(--muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      font-weight: 700;
      color: var(--muted);
      text-align: right;
      padding: 10px 8px;
      border-bottom: 2px solid var(--line);
      background: var(--card);
    }

    td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--line);
    }

    .tbl-wrap {
      overflow: auto;
      max-height: 70vh;
      border-radius: var(--r);
      border: 1px solid var(--line);
      background: var(--card);
    }

    /* ---------------- TOAST ---------------- */

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #fff;
      padding: 12px 22px;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 99;
    }

    .toast.on {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.err {
      background: var(--bad);
    }

    /* ---------------- LOGIN ---------------- */

    .login {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
    }

    .login .art {
      background: var(--tile);
      padding: 48px;
      color: #fff;
      display: flex;
      align-items: flex-end;
      position: relative;
    }

    .login .form {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .login .form .card {
      width: 100%;
      max-width: 400px;
      padding: 32px;
    }

    .banner {
      background: var(--warn-bg);
      color: var(--warn);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    /* ---------------- MOBILE ---------------- */

    @media (max-width: 820px) {
      .login {
        grid-template-columns: 1fr;
      }

      .login .art {
        min-height: 220px;
        padding: 30px;
      }

      .top-in {
        padding: 10px 14px;
      }

      main {
        padding: 18px 14px 60px;
      }
    }
  </style>
</head>

<body>

  <div id="app"></div>

  <div id="toast" class="toast"></div>

  <script>
    'use strict';

    /* =========================================================
       SUPABASE CONFIG
       ========================================================= */

    const SUPABASE_URL =
      'https://hpgvgoehkcpjmdbfmnse.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_BuJxTaMP2rYWTe5mh-N55Q_gSHE1O8g';

    /* =========================================================
       GLOBAL STATE
       ========================================================= */

    let sb = null;

    const MONTHS = [
      'فروردین',
      'اردیبهشت',
      'خرداد',
      'تیر',
      'مرداد',
      'شهریور',
      'مهر',
      'آبان',
      'آذر',
      'دی',
      'بهمن',
      'اسفند'
    ];

    const CATS = {
      charge: 'شارژ ماهیانه',
      water: 'قبض آب',
      gas: 'قبض گاز',
      repair: 'بازسازی',
      parking: 'اجاره پارکینگ',
      debt: 'پرداخت بدهی معوق',
      other: 'سایر',
      bill: 'کل صورتحساب ماه'
    };

    const OCC = [
      'مالک ساکن',
      'مالک',
      'مستأجر'
    ];

    /* =========================================================
       HELPERS
       ========================================================= */

    const $ = (selector, element = document) => {
      return element.querySelector(selector);
    };

    const $$ = (selector, element = document) => {
      return Array.from(element.querySelectorAll(selector));
    };

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function fmt(value) {
      return new Intl.NumberFormat('fa-IR').format(
        Math.round(Number(value) || 0)
      );
    }

    function money(value) {
      const number = Number(value) || 0;

      return `
        <span class="num ${number < 0 ? 'neg' : ''}">
          ${fmt(number)}
        </span>
      `;
    }

    function toNum(value) {
      return Number(
        String(value ?? '')
          .replace(/[^\d.-]/g, '')
      ) || 0;
    }

    function fa(value) {
      return String(value ?? '');
    }

    /* =========================================================
       DATE
       ========================================================= */

    function jalaliToday() {
      /*
       * تاریخ فعلی برنامه.
       * در صورت نیاز بعداً می‌توان آن را به تاریخ واقعی
       * شمسی متصل کرد.
       */

      return {
        y: 1405,
        m: 7,
        d: 15
      };
    }

    const TODAY = jalaliToday();

    /* =========================================================
       APPLICATION STATE
       ========================================================= */

    const S = {
      token: localStorage.getItem('bm_token') || null,

      me: (() => {
        try {
          return JSON.parse(
            localStorage.getItem('bm_me') || 'null'
          );
        } catch (e) {
          return null;
        }
      })(),

      view: 'dash',

      y: TODAY.y,

      m: TODAY.m,

      building: 'ساختمان'
    };

    /* =========================================================
       TOAST
       ========================================================= */

    function toast(message, error = false) {
      const element = $('#toast');

      if (!element) {
        return;
      }

      element.textContent = message;

      element.className =
        'toast on' + (error ? ' err' : '');

      clearTimeout(element._timeout);

      element._timeout = setTimeout(() => {
        element.className = 'toast';
      }, 3200);
    }

    /* =========================================================
       SUPABASE INITIALIZATION
       ========================================================= */

    function initializeSupabase() {

      if (!window.supabase) {
        throw new Error(
          'کتابخانه Supabase بارگذاری نشده است. اتصال اینترنت و فایل CDN را بررسی کنید.'
        );
      }

      if (
        !SUPABASE_URL ||
        !SUPABASE_KEY
      ) {
        throw new Error(
          'اطلاعات اتصال Supabase کامل نیست.'
        );
      }

      sb = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: false
          }
        }
      );

      return sb;
    }

    /* =========================================================
       API
       ========================================================= */

    async function api(fn, args = {}) {

      if (!sb) {
        throw new Error(
          'اتصال به Supabase برقرار نشده است.'
        );
      }

      if (!fn) {
        throw new Error(
          'نام تابع سرور مشخص نشده است.'
        );
      }

      try {

        const result = await sb.rpc(
          fn,
          args
        );

        const data = result.data;
        const error = result.error;

        if (error) {

          const message =
            error.message ||
            'خطا در ارتباط با سرور';

          if (
            message.startsWith('AUTH_REQUIRED')
          ) {
            await logout(true);
          }

          throw new Error(
            message.replace(
              /^AUTH_REQUIRED:\s*/,
              ''
            )
          );
        }

        return data;

      } catch (error) {

        if (error instanceof Error) {
          throw error;
        }

        throw new Error(
          'خطا در ارتباط با سرور'
        );
      }
    }

    function T(fn, args = {}) {

      return api(
        fn,
        {
          p_token: S.token,
          ...args
        }
      );
    }

    /* =========================================================
       LOGIN PAGE
       ========================================================= */

    async function renderLogin() {

      document.title =
        'ورود | مدیریت ساختمان';

      const app = $('#app');

      if (!app) {
        return;
      }

      app.innerHTML = `
        <div class="login">

          <div class="art">
            <div>
              <h1 id="lg-name">
                ساختمان
              </h1>

              <p>
                مدیریت صندوق و واحدها
              </p>
            </div>
          </div>

          <div class="form">

            <div class="card">

              <h2>
                ورود ساکنین
              </h2>

              <form
                id="lg"
                class="grid"
                style="gap:14px"
              >

                <label class="f">

                  واحد

                  <select id="lg-acc">
                    <option value="">
                      در حال بارگذاری…
                    </option>
                  </select>

                </label>

                <label class="f">

                  یا نام کاربری

                  <input
                    id="lg-user"
                    autocomplete="username"
                    dir="ltr"
                  >

                </label>

                <label class="f">

                  رمز عبور

                  <input
                    id="lg-pass"
                    type="password"
                    autocomplete="current-password"
                    dir="ltr"
                    required
                  >

                </label>

                <button
                  class="btn sf"
                  type="submit"
                >
                  ورود
                </button>

                <p
                  id="lg-err"
                  class="neg"
                  style="margin:0;min-height:1.7em"
                ></p>

              </form>

            </div>

          </div>

        </div>
      `;

      /* دریافت اطلاعات عمومی */

      try {

        const info =
          await api('app_public_info');

        if (info) {

          if (info.building_name) {

            S.building =
              info.building_name;

            const nameElement =
              $('#lg-name');

            if (nameElement) {
              nameElement.textContent =
                info.building_name;
            }
          }

          const accountSelect =
            $('#lg-acc');

          if (
            accountSelect &&
            Array.isArray(info.accounts)
          ) {

            accountSelect.innerHTML =
              '<option value="">انتخاب واحد…</option>' +

              info.accounts.map(account => {

                const id =
                  esc(account.id);

                const unitNo =
                  esc(account.unit_no);

                const fullName =
                  esc(account.full_name || '');

                const occupancy =
                  esc(account.occupancy || '');

                const admin =
                  account.is_admin
                    ? ' · مدیر'
                    : '';

                return `
                  <option value="${id}">
                    واحد ${unitNo}
                    · ${fullName}
                    (${occupancy})
                    ${admin}
                  </option>
                `;

              }).join('');
          }
        }

      } catch (error) {

        console.error(
          'app_public_info error:',
          error
        );

        const accountSelect =
          $('#lg-acc');

        if (accountSelect) {

          accountSelect.innerHTML =
            '<option value="">اطلاعات واحدها در دسترس نیست</option>';
        }
      }

      /* انتخاب واحد */

      const accountSelect =
        $('#lg-acc');

      if (accountSelect) {

        accountSelect.addEventListener(
          'change',
          () => {

            if (accountSelect.value) {

              const username =
                $('#lg-user');

              if (username) {
                username.value = '';
              }
            }
          }
        );
      }

      /* ورود با نام کاربری */

      const username =
        $('#lg-user');

      if (username) {

        username.addEventListener(
          'input',
          () => {

            if (username.value) {

              const accountSelect =
                $('#lg-acc');

              if (accountSelect) {
                accountSelect.value = '';
              }
            }
          }
        );
      }

      /* Submit فرم ورود */

      const loginForm =
        $('#lg');

      if (!loginForm) {
        return;
      }

      loginForm.addEventListener(
        'submit',
        async event => {

          event.preventDefault();

          const userElement =
            $('#lg-user');

          const accountElement =
            $('#lg-acc');

          const passwordElement =
            $('#lg-pass');

          const errorElement =
            $('#lg-err');

          if (
            !userElement ||
            !accountElement ||
            !passwordElement ||
            !errorElement
          ) {
            return;
          }

          /*
           * مهم:
           * اینجا عملگر || صحیح است.
           */

          const login =
            userElement.value.trim() ||
            accountElement.value;

          const password =
            passwordElement.value;

          if (!login) {

            errorElement.textContent =
              'واحد یا نام کاربری را وارد کنید';

            return;
          }

          if (!password) {

            errorElement.textContent =
              'رمز عبور را وارد کنید';

            return;
          }

          errorElement.textContent =
            'در حال ورود…';

          try {

            const result =
              await api(
                'app_login',
                {
                  p_login: login,
                  p_password: password
                }
              );

            if (!result) {

              errorElement.textContent =
                'پاسخ معتبری از سرور دریافت نشد';

              return;
            }

            if (!result.ok) {

              errorElement.textContent =
                result.error ||
                'نام کاربری یا رمز عبور اشتباه است';

              return;
            }

            S.token =
              result.token;

            S.me =
              result.account;

            localStorage.setItem(
              'bm_token',
              S.token
            );

            localStorage.setItem(
              'bm_me',
              JSON.stringify(S.me)
            );

            await renderShell();

          } catch (error) {

            console.error(
              'login error:',
              error
            );

            errorElement.textContent =
              error.message ||
              'خطا در ورود';
          }

        }
      );
    }

    /* =========================================================
       LOGOUT
       ========================================================= */

    async function logout(silent = false) {

      const oldToken =
        S.token;

      if (
        oldToken &&
        !silent
      ) {

        try {

          await api(
            'app_logout',
            {
              p_token: oldToken
            }
          );

        } catch (error) {

          console.warn(
            'logout server error:',
            error
          );
        }
      }

      S.token = null;
      S.me = null;

      localStorage.removeItem(
        'bm_token'
      );

      localStorage.removeItem(
        'bm_me'
      );

      await renderLogin();
    }

    /* =========================================================
       MAIN SHELL
       ========================================================= */

    async function renderShell() {

      /*
       * اگر توکن وجود ندارد،
       * مستقیماً به صفحه ورود برو.
       */

      if (!S.token) {

        await renderLogin();

        return;
      }

      /* دریافت اطلاعات کاربر */

      try {

        S.me =
          await T('app_me');

        if (S.me) {

          localStorage.setItem(
            'bm_me',
            JSON.stringify(S.me)
          );
        }

      } catch (error) {

        console.error(
          'app_me error:',
          error
        );

        await logout(true);

        return;
      }

      if (!S.me) {

        await logout(true);

        return;
      }

      document.title =
        `${S.building} | مدیریت ساختمان`;

      const app =
        $('#app');

      if (!app) {
        return;
      }

      const isAdmin =
        Boolean(S.me.is_admin);

      app.innerHTML = `

        <header class="top">

          <div class="top-in">

            <div class="brand">

              <i></i>

              ${esc(S.building)}

            </div>

            <nav class="tabs">

              <button
                data-v="dash"
                class="on"
                type="button"
              >
                داشبورد
              </button>

              <button
                data-v="tx"
                type="button"
              >
                تراکنش‌ها
              </button>

              <button
                data-v="report"
                type="button"
              >
                گزارش ماهانه
              </button>

              ${
                isAdmin
                  ? `
                    <button
                      data-v="units"
                      type="button"
                    >
                      واحدها
                    </button>

                    <button
                      data-v="rates"
                      type="button"
                    >
                      نرخ‌ها
                    </button>
                  `
                  : ''
              }

            </nav>

            <div class="who">

              <span>
                واحد ${esc(S.me.unit_no)}
                ·
                <b>
                  ${esc(
                    S.me.full_name ||
                    S.me.username ||
                    ''
                  )}
                </b>
              </span>

              <button
                class="btn-ghost"
                id="lo"
                type="button"
              >
                خروج
              </button>

            </div>

          </div>

        </header>

        <main id="view"></main>
      `;

      /* Navigation */

      $$('.tabs button').forEach(
        button => {

          button.addEventListener(
            'click',
            async () => {

              await go(
                button.dataset.v
              );
            }
          );
        }
      );

      /* Logout */

      const logoutButton =
        $('#lo');

      if (logoutButton) {

        logoutButton.addEventListener(
          'click',
          () => logout(false)
        );
      }

      await go('dash');
    }

    /* =========================================================
       NAVIGATION
       ========================================================= */

    async function go(view) {

      const element =
        $('#view');

      if (!element) {
        return;
      }

      S.view = view;

      /* تغییر وضعیت تب‌ها */

      $$('.tabs button').forEach(
        button => {

          button.classList.toggle(
            'on',
            button.dataset.v === view
          );
        }
      );

      element.innerHTML = `
        <div class="loading">
          در حال بارگذاری…
        </div>
      `;

      try {

        if (view === 'dash') {

          await viewDash(element);

        } else if (view === 'tx') {

          await viewTx(element);

        } else if (view === 'report') {

          await viewReport(element);

        } else if (
          view === 'units' &&
          S.me &&
          S.me.is_admin
        ) {

          await viewUnits(element);

        } else if (
          view === 'rates' &&
          S.me &&
          S.me.is_admin
        ) {

          await viewRates(element);

        } else {

          element.innerHTML = `
            <div class="banner">
              این بخش برای شما در دسترس نیست.
            </div>
          `;
        }

      } catch (error) {

        console.error(
          `view ${view} error:`,
          error
        );

        element.innerHTML = `
          <div class="banner">
            ${esc(
              error.message ||
              'خطا در بارگذاری صفحه'
            )}
          </div>
        `;
      }
    }

    /* =========================================================
       DASHBOARD
       ========================================================= */

    async function viewDash(element) {

      if (!S.token) {

        await renderLogin();

        return;
      }

      let report = null;

      try {

        report =
          await T(
            'app_report',
            {
              p_year: S.y,
              p_month: S.m
            }
          );

      } catch (error) {

        console.error(
          'app_report error:',
          error
        );

        /*
         * اگر تابع گزارش هنوز در دیتابیس
         * ساخته نشده باشد، داشبورد همچنان
         * باز شود.
         */

        report = null;
      }

      const monthName =
        report &&
        report.month_name
          ? report.month_name
          : MONTHS[S.m - 1] || '';

      const year =
        report &&
        report.year
          ? report.year
          : S.y;

      element.innerHTML = `

        <div class="spread">

          <div>

            <h1>
              داشبورد
            </h1>

            <p class="sub">
              ${esc(monthName)}
              ${esc(year)}
            </p>

          </div>

        </div>

        <div class="card">

          <h2>
            خوش آمدید
          </h2>

          <p>
            سیستم مدیریت ساختمان با موفقیت اجرا شد.
          </p>

          <p class="muted">
            کاربر:
            ${esc(
              S.me?.full_name ||
              S.me?.username ||
              ''
            )}
          </p>

        </div>
      `;
    }

    /* =========================================================
       TRANSACTIONS
       ========================================================= */

    async function viewTx(element) {

      element.innerHTML = `

        <div class="spread">

          <div>

            <h1>
              تراکنش‌ها
            </h1>

            <p class="sub">
              مدیریت تراکنش‌های مالی ساختمان
            </p>

          </div>

        </div>

        <div class="card">

          <p>
            بخش تراکنش‌ها آماده است و
            می‌توانیم فرم ثبت درآمد،
            هزینه، شارژ و پرداخت بدهی را
            به آن اضافه کنیم.
          </p>

        </div>
      `;
    }

    /* =========================================================
       REPORT
       ========================================================= */

    async function viewReport(element) {

      element.innerHTML = `

        <div class="spread">

          <div>

            <h1>
              گزارش ماهانه
            </h1>

            <p class="sub">
              گزارش مالی ساختمان
            </p>

          </div>

        </div>

        <div class="card">

          <p>
            بخش گزارش ماهانه آماده است.
          </p>

        </div>
      `;
    }

    /* =========================================================
       UNITS
       ========================================================= */

    async function viewUnits(element) {

      element.innerHTML = `

        <div class="spread">

          <div>

            <h1>
              واحدها
            </h1>

            <p class="sub">
              مدیریت واحدهای ساختمان
            </p>

          </div>

        </div>

        <div class="card">

          <p>
            بخش مدیریت واحدها آماده است.
          </p>

        </div>
      `;
    }

    /* =========================================================
       RATES
       ========================================================= */

    async function viewRates(element) {

      element.innerHTML = `

        <div class="spread">

          <div>

            <h1>
              نرخ‌ها
            </h1>

            <p class="sub">
              مدیریت نرخ شارژ و هزینه‌ها
            </p>

          </div>

        </div>

        <div class="card">

          <p>
            بخش مدیریت نرخ‌ها آماده است.
          </p>

        </div>
      `;
    }

    /* =========================================================
       APPLICATION START
       ========================================================= */

    async function startApp() {

      const app =
        $('#app');

      if (!app) {
        return;
      }

      app.innerHTML = `
        <div class="loading">
          در حال راه‌اندازی برنامه…
        </div>
      `;

      try {

        /* اول Supabase */

        initializeSupabase();

        /* سپس بررسی ورود */

        if (
          S.token &&
          S.me
        ) {

          await renderShell();

        } else {

          await renderLogin();
        }

      } catch (error) {

        console.error(
          'APPLICATION ERROR:',
          error
        );

        app.innerHTML = `

          <div
            style="
              min-height:100vh;
              display:flex;
              align-items:center;
              justify-content:center;
              padding:20px;
            "
          >

            <div
              class="card"
              style="max-width:600px;width:100%"
            >

              <h2>
                خطا در اجرای برنامه
              </h2>

              <div class="banner">
                ${esc(
                  error.message ||
                  'خطای ناشناخته'
                )}
              </div>

              <p class="muted">
                لطفاً اتصال اینترنت،
                آدرس Supabase و کلید اتصال
                را بررسی کنید.
              </p>

              <button
                class="btn"
                type="button"
                onclick="location.reload()"
              >
                تلاش مجدد
              </button>

            </div>

          </div>
        `;
      }
    }

    /* اجرای برنامه بعد از آماده شدن DOM */

    if (
      document.readyState === 'loading'
    ) {

      document.addEventListener(
        'DOMContentLoaded',
        startApp
      );

    } else {

      startApp();
    }

  </script>

</body>
</html>
