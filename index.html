<html lang="fa" dir="rtl"><head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>مدیریت ساختمان</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900\&amp;display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{

&#x20; --tile:#004759; --tile-2:#006289; --saffron:#e84a00; --brick:#bb1d2c; --plum:#661f66;

&#x20; --paper:#fbf8f5; --card:#ffffff; --line:#e9e1da; --ink:#2b2420; --muted:#7a6c63;

&#x20; --ok:#0f7a5a; --ok-bg:#e3f4ed; --warn:#b54700; --warn-bg:#fdeee4; --bad:#bb1d2c; --bad-bg:#fbe6e8;

&#x20; --r:14px;

}

\*{box-sizing:border-box}

html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:15px;line-height:1.7}

button,input,select,textarea{font:inherit;color:inherit}

a{color:var(--tile-2)}

.hidden{display:none!important}

/\* ---------- top ---------- \*/

header.top{background:var(--tile);color:#fff;position:sticky;top:0;z-index:20;

&#x20; background-image:radial-gradient(circle at 12px 12px,rgba(255,255,255,.07) 2px,transparent 3px);background-size:24px 24px}

.top-in{max-width:1180px;margin:auto;display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}

.brand{font-weight:900;font-size:20px;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}

.brand i{width:12px;height:28px;background:var(--saffron);border-radius:3px;display:inline-block}

nav.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}

nav.tabs button{background:transparent;border:0;color:#cfe3e8;padding:7px 14px;border-radius:99px;cursor:pointer;font-weight:500}

nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.08)}

nav.tabs button.on{background:#fff;color:var(--tile);font-weight:700}

.who{display:flex;align-items:center;gap:10px;font-size:14px;color:#cfe3e8}

.who b{color:#fff}

.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:99px;padding:5px 14px;cursor:pointer}

main{max-width:1180px;margin:auto;padding:24px 20px 80px}

/\* ---------- basics ---------- \*/

h1{font-size:30px;font-weight:900;margin:0 0 4px;letter-spacing:-.5px}

h2{font-size:20px;font-weight:700;margin:0 0 12px}

.sub{color:var(--muted);margin:0 0 20px}

.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.spread{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}

.grid{display:grid;gap:16px}

.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}

.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);min-width:0}

input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;min-height:42px;width:100%}

input:focus,select:focus,textarea:focus{outline:2px solid var(--tile-2);outline-offset:-1px;border-color:transparent}

.btn{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:700;background:var(--tile);color:#fff;min-height:42px;white-space:nowrap}

.btn:hover{background:var(--tile-2)}

.btn.sf{background:var(--saffron)} .btn.sf:hover{background:#c93f00}

.btn.lt{background:#eef3f4;color:var(--tile)} .btn.lt:hover{background:#e0eaec}

.btn.rd{background:var(--bad-bg);color:var(--bad)}

.btn.sm{padding:5px 12px;min-height:32px;font-size:14px;border-radius:8px}

.btn:disabled{opacity:.5;cursor:default}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:1px 10px;font-size:14px;font-weight:700;white-space:nowrap}

.chip.ok{background:var(--ok-bg);color:var(--ok)}

.chip.no{background:var(--warn-bg);color:var(--warn)}

.chip.ex{background:#efeae6;color:var(--muted)}

.chip.pd{background:#ece4f3;color:var(--plum)}

.num{font-feature-settings:"tnum";white-space:nowrap}

.neg{color:var(--bad)}

.muted{color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:14px}

th{font-weight:700;color:var(--muted);text-align:right;padding:10px 8px;border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}

td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}

tr:hover td{background:#fcfaf8}

.tbl-wrap{overflow:auto;max-height:70vh;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;opacity:0;transition:.25s;z-index:99;max-width:90vw}

.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.toast.err{background:var(--bad)}

/\* ---------- login ---------- \*/

.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}

.login .art{background:var(--tile);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:48px;color:#fff}

.login .art h1{font-size:56px;line-height:1.15;position:relative;z-index:2}

.login .art p{color:#cfe3e8;position:relative;z-index:2;margin:8px 0 0}

.login .form{display:flex;align-items:center;justify-content:center;padding:32px}

.login .form .card{width:100%;max-width:400px;padding:32px}

@media(max-width:820px){.login{grid-template-columns:1fr}.login .art{min-height:300px;padding:28px}.login .art h1{font-size:38px}}

/\* ---------- facade (signature) ---------- \*/

.facade{background:linear-gradient(#f3ebe4,#efe5dc);border-radius:var(--r);padding:28px 28px 0;border:1px solid var(--line);position:relative}

.roof{height:14px;background:var(--brick);border-radius:6px 6px 0 0;margin:0 -10px}

.tower{background:#c9b5a5;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;

&#x20; background-image:linear-gradient(90deg,rgba(0,0,0,.05) 1px,transparent 1px),linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:22px 11px}

.win{border:0;cursor:pointer;border-radius:10px 10px 4px 4px;padding:12px 14px;text-align:right;color:#fff;background:var(--tile-2);

&#x20; box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);transition:transform .15s;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}

.win:hover{transform:translateY(-2px)}

.win .u{font-weight:900;font-size:18px}

.win .n{font-size:14px;opacity:.85}

.win .d{font-weight:700;font-size:15px}

.win.clear{background:var(--ok)}

.win.owe{background:var(--saffron)}

.win.heavy{background:var(--brick)}

.win.me{outline:3px solid var(--ink);outline-offset:2px}

.ground{height:34px;background:#8d7666;margin:0 -10px;border-radius:0 0 8px 8px;display:flex;justify-content:center}

.ground span{width:64px;background:var(--tile);border-radius:6px 6px 0 0;margin-top:2px}

.legend{display:flex;gap:14px;font-size:14px;color:var(--muted);margin:12px 0 18px;flex-wrap:wrap}

.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:6px;vertical-align:-1px}

/\* ---------- bill ---------- \*/

.bill{padding:0;overflow:hidden}

.bill-head{background:var(--tile);color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

.bill-head .big{font-size:40px;font-weight:900;line-height:1}

.bill-lines{padding:8px 24px}

.bill-line{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line);gap:12px}

.bill-line:last-child{border:0}

.bill-foot{background:#f6f1ec;padding:16px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}

.kv small{display:block;color:var(--muted);font-size:14px}

.kv b{font-size:20px}

.stat{padding:18px}

.stat small{color:var(--muted);display:block}

.stat b{font-size:26px;font-weight:900}

.hero-balance{background:var(--saffron);color:#fff;border:0}

.hero-balance small{color:#ffe1d1}

.hero-balance b{font-size:38px}

/\* ---------- modal ---------- \*/

.modal-bg{position:fixed;inset:0;background:rgba(30,20,15,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}

.modal{background:var(--card);border-radius:18px;width:100%;max-width:720px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.25)}

.modal .x{float:left;background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted)}

.acc{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}

.checks{display:flex;gap:14px;flex-wrap:wrap}

.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}

.checks input{width:auto;min-height:0}

.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-weight:500}

@media print{header.top,.no-print{display:none!important}main{padding:0}.tbl-wrap{max-height:none;overflow:visible;border:0}body{background:#fff}}

</style>

</head>

<body>

<div id="app"></div>

<div id="toast" class="toast"></div>



<script>

// =====================================================================

//  تنظیمات Supabase

// =====================================================================

const SUPABASE\_URL = 'https://hpgvgoehkcpjmdbfmnse.supabase.co';

const SUPABASE\_KEY = 'sb\_publishable\_BuJxTaMP2rYWTe5mh-N55Q\_gSHE1O8g';

const sb = window.supabase.createClient(SUPABASE\_URL, SUPABASE\_KEY, { auth: { persistSession: false } });



// =====================================================================

//  کمکی‌ها

// =====================================================================

const MONTHS = \['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

const CATS = { charge:'شارژ ماهیانه', water:'قبض آب', gas:'قبض گاز', repair:'بازسازی', parking:'اجاره پارکینگ', debt:'پرداخت بدهی معوق', other:'سایر', bill:'کل صورتحساب ماه' };

const OCC = \['مالک ساکن','مالک','مستأجر'];

const $ = (s, el = document) => el.querySelector(s);

const $$ = (s, el = document) => \[...el.querySelectorAll(s)];

const esc = s => String(s ?? '').replace(/\[\&<>"']/g, c => ({'\&':'\&amp;','<':'\&lt;','>':'\&gt;','"':'\&quot;',"'":'\&#39;'}\[c]));

const fmt = n => new Intl.NumberFormat('fa-IR').format(Math.round(Number(n) || 0));

const money = n => `<span class="num ${Number(n) < 0 ? 'neg' : ''}">${fmt(n)}</span>`;

const fa = v => String(v ?? '').replace(/\\d/g, d => '۰۱۲۳۴۵۶۷۸۹'\[d]);

const toNum = v => Number(String(v ?? '').replace(/\[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\[^\\d.-]/g, '')) || 0;



function jalaliToday() {

&#x20; const p = new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn', { year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(new Date());

&#x20; const g = t => Number(p.find(x => x.type === t)?.value);

&#x20; return { y: g('year'), m: g('month'), d: g('day') };

}

const TODAY = jalaliToday();



function toast(msg, err = false) {

&#x20; const t = $('#toast');

&#x20; t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');

&#x20; clearTimeout(t.\_h); t.\_h = setTimeout(() => t.className = 'toast', 3200);

}



const S = {

&#x20; token: localStorage.getItem('bm\_token'),

&#x20; me: JSON.parse(localStorage.getItem('bm\_me') || 'null'),

&#x20; view: 'dash', y: TODAY.y, m: TODAY.m, building: 'ساختمان',

};



async function api(fn, args = {}) {

&#x20; const { data, error } = await sb.rpc(fn, args);

&#x20; if (error) {

&#x20;   const msg = (error.message || '').replace(/^AUTH\_REQUIRED:\\s\*/, '');

&#x20;   if ((error.message || '').startsWith('AUTH\_REQUIRED')) { logout(true); }

&#x20;   throw new Error(msg || 'خطا در ارتباط با سرور');

&#x20; }

&#x20; return data;

}

const T = (fn, args = {}) => api(fn, { p\_token: S.token, ...args });



function smsLink(phone, text) {

&#x20; if (!phone) return '';

&#x20; const sep = /iPhone|iPad|iPod/.test(navigator.userAgent) ? '\&' : '?';

&#x20; return `sms:${phone}${sep}body=${encodeURIComponent(text)}`;

}

function smsBtn(phone, text, label = 'پیامک') {

&#x20; if (!phone) return `<span class="muted" title="شماره ثبت نشده">—</span>`;

&#x20; return `<a class="btn lt sm" href="${smsLink(phone, text)}">✉ ${label}</a>`;

}



function yearOptions(sel) {

&#x20; const ys = \[]; for (let y = TODAY.y + 1; y >= 1403; y--) ys.push(y);

&#x20; return ys.map(y => `<option value="${y}" ${y == sel ? 'selected' : ''}>${fa(y)}</option>`).join('');

}

const monthOptions = (sel, withAll = false) =>

&#x20; (withAll ? `<option value="">همه ماه‌ها</option>` : '') +

&#x20; MONTHS.map((n, i) => `<option value="${i + 1}" ${i + 1 == sel ? 'selected' : ''}>${n}</option>`).join('');

const unitOptions = (sel, withBuilding = true, withAll = false) =>

&#x20; (withAll ? `<option value="">همه</option>` : '') +

&#x20; (withBuilding ? `<option value="0" ${sel === 0 || sel === '0' ? 'selected' : ''}>ساختمان</option>` : '') +

&#x20; Array.from({ length: 10 }, (\_, i) => `<option value="${i + 1}" ${sel == i + 1 ? 'selected' : ''}>واحد ${fa(i + 1)}</option>`).join('');



function periodPicker() {

&#x20; return `<div class="row no-print">

&#x20;   <select id="pk-m" style="width:auto">${monthOptions(S.m)}</select>

&#x20;   <select id="pk-y" style="width:auto">${yearOptions(S.y)}</select></div>`;

}

function bindPeriod(cb) {

&#x20; $('#pk-m')?.addEventListener('change', e => { S.m = +e.target.value; cb(); });

&#x20; $('#pk-y')?.addEventListener('change', e => { S.y = +e.target.value; cb(); });

}



function modal(html) {

&#x20; const bg = document.createElement('div');

&#x20; bg.className = 'modal-bg';

&#x20; bg.innerHTML = `<div class="modal"><button class="x" aria-label="بستن">×</button>${html}</div>`;

&#x20; bg.addEventListener('click', e => { if (e.target === bg || e.target.classList.contains('x')) bg.remove(); });

&#x20; document.body.appendChild(bg);

&#x20; return bg;

}



// =====================================================================

//  ورود

// =====================================================================

async function renderLogin() {

&#x20; document.title = 'ورود | مدیریت ساختمان';

&#x20; $('#app').innerHTML = `

&#x20; <div class="login">

&#x20;   <div class="art">

&#x20;     <svg viewBox="0 0 400 400" style="position:absolute;inset:0;width:100%;height:100%;opacity:.16" preserveAspectRatio="xMidYMid slice">

&#x20;       <defs><pattern id="tl" width="80" height="80" patternUnits="userSpaceOnUse">

&#x20;         <path d="M40 0 L80 40 L40 80 L0 40Z" fill="none" stroke="#fff" stroke-width="2"/>

&#x20;         <circle cx="40" cy="40" r="10" fill="none" stroke="#e84a00" stroke-width="3"/></pattern></defs>

&#x20;       <rect width="400" height="400" fill="url(#tl)"/></svg>

&#x20;     <div><h1 id="lg-name">ساختمان</h1><p>صورتحساب، پرداخت و صندوق ۱۰ واحد، یک‌جا.</p></div>

&#x20;   </div>

&#x20;   <div class="form"><div class="card">

&#x20;     <h2>ورود ساکنین</h2>

&#x20;     <form id="lg" class="grid" style="gap:14px">

&#x20;       <label class="f">واحد

&#x20;         <select id="lg-acc"><option value="">در حال بارگذاری…</option></select></label>

&#x20;       <label class="f">یا نام کاربری

&#x20;         <input id="lg-user" autocomplete="username" placeholder="مثلاً negin1" dir="ltr"></label>

&#x20;       <label class="f">رمز عبور

&#x20;         <input id="lg-pass" type="password" autocomplete="current-password" dir="ltr" required></label>

&#x20;       <button class="btn sf" type="submit">ورود</button>

&#x20;       <p id="lg-err" class="neg" style="margin:0;min-height:1.7em"></p>

&#x20;     </form>

&#x20;   </div></div>

&#x20; </div>`;

&#x20; try {

&#x20;   const info = await api('app\_public\_info');

&#x20;   S.building = info.building\_name;

&#x20;   $('#lg-name').textContent = info.building\_name;

&#x20;   $('#lg-acc').innerHTML = `<option value="">انتخاب واحد…</option>` + info.accounts.map(a =>

&#x20;     `<option value="${a.id}">واحد ${fa(a.unit\_no)} · ${esc(a.full\_name || '')} (${esc(a.occupancy)})${a.is\_admin ? ' · مدیر' : ''}</option>`).join('');

&#x20; } catch (e) { $('#lg-err').textContent = 'اتصال به پایگاه داده برقرار نشد. فایل SQL اجرا شده است؟'; }

&#x20; $('#lg-acc').addEventListener('change', () => { if ($('#lg-acc').value) $('#lg-user').value = ''; });

&#x20; $('#lg-user').addEventListener('input', () => { if ($('#lg-user').value) $('#lg-acc').value = ''; });

&#x20; $('#lg').addEventListener('submit', async e => {

&#x20;   e.preventDefault();

&#x20;   const login = $('#lg-user').value.trim() || $('#lg-acc').value;

&#x20;   if (!login) { $('#lg-err').textContent = 'واحد یا نام کاربری را وارد کنید'; return; }

&#x20;   try {

&#x20;     const r = await api('app\_login', { p\_login: login, p\_password: $('#lg-pass').value });

&#x20;     if (!r.ok) { $('#lg-err').textContent = r.error; return; }

&#x20;     S.token = r.token; S.me = r.account;

&#x20;     localStorage.setItem('bm\_token', S.token); localStorage.setItem('bm\_me', JSON.stringify(S.me));

&#x20;     S.view = 'dash'; renderShell();

&#x20;   } catch (err) { $('#lg-err').textContent = err.message; }

&#x20; });

}



async function logout(silent = false) {

&#x20; if (S.token \&\& !silent) { try { await api('app\_logout', { p\_token: S.token }); } catch (e) {} }

&#x20; S.token = null; S.me = null;

&#x20; localStorage.removeItem('bm\_token'); localStorage.removeItem('bm\_me');

&#x20; renderLogin();

}



// =====================================================================

//  قالب اصلی

// =====================================================================

function tabs() {

&#x20; const a = S.me?.is\_admin;

&#x20; return \[

&#x20;   \['dash', 'داشبورد'],

&#x20;   a \&\& \['units', 'واحدها'],

&#x20;   \['tx', 'تراکنش‌ها'],

&#x20;   \['pay', a ? 'تایید پرداخت‌ها' : 'پرداخت بدهی'],

&#x20;   \['report', 'گزارش ماهانه'],

&#x20;   a \&\& \['rates', 'نرخ‌ها و تنظیمات'],

&#x20;   \['profile', 'پروفایل'],

&#x20; ].filter(Boolean);

}



async function renderShell() {

&#x20; try { S.me = await T('app\_me'); localStorage.setItem('bm\_me', JSON.stringify(S.me)); }

&#x20; catch (e) { if (S.token) { $('#app').innerHTML = `<main><div class="banner">${esc(e.message)}</div><button class="btn" onclick="logout(true)">ورود مجدد</button></main>`; } return; }

&#x20; try { const info = await api('app\_public\_info'); S.building = info.building\_name; } catch (e) {}

&#x20; document.title = S.building + ' | مدیریت ساختمان';

&#x20; $('#app').innerHTML = `

&#x20; <header class="top"><div class="top-in">

&#x20;   <div class="brand"><i></i>${esc(S.building)}</div>

&#x20;   <nav class="tabs">${tabs().map((\[k, l]) => `<button data-v="${k}" class="${S.view === k ? 'on' : ''}">${l}</button>`).join('')}</nav>

&#x20;   <div class="who"><span>واحد ${fa(S.me.unit\_no)} · <b>${esc(S.me.full\_name || S.me.username)}</b>${S.me.is\_admin ? ' (مدیر)' : ''}</span>

&#x20;     <button class="btn-ghost" id="lo">خروج</button></div>

&#x20; </div></header>

&#x20; <main id="view"></main>`;

&#x20; $$('nav.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));

&#x20; $('#lo').addEventListener('click', () => logout());

&#x20; go(S.view);

}



function go(v) {

&#x20; S.view = v;

&#x20; $$('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));

&#x20; const map = { dash: viewDash, units: viewUnits, tx: viewTx, pay: viewPay, report: viewReport, rates: viewRates, profile: viewProfile };

&#x20; const el = $('#view');

&#x20; el.innerHTML = `<p class="muted">در حال بارگذاری…</p>`;

&#x20; (map\[v] || viewDash)(el).catch(e => { el.innerHTML = `<div class="banner">${esc(e.message)}</div>`; });

}



const mustChangeBanner = () => S.me?.must\_change\_password

function exportCsv(rows) {

&#x20; const head = \['data', 'Year', 'Month', 'ماه', 'واحد', 'نوع', 'محل', 'شرح', 'مبلغ', 'نوع سکونت'];

&#x20; const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;

&#x20; const lines = \[head.map(q).join(',')].concat(rows.slice().reverse().map(t =>

&#x20;   \[t.tx\_date, t.year, t.month, t.month\_name, t.unit\_no ? 'واحد ' + t.unit\_no : 'ساختمان', t.tx\_type, t.location, t.description, t.amount, t.occupancy].map(q).join(',')));

&#x20; const blob = new Blob(\['\\ufeff' + lines.join('\\r\\n')], { type: 'text/csv;charset=utf-8' });

&#x20; const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Table2.csv'; a.click();

}

&#x20; <form id="pf2" class="card grid g2" style="max-width:760px">

&#x20;   <label class="f">نام<input id="p-n" value="${esc(a.full\_name || '')}"></label>

&#x20;   <label class="f">شماره موبایل<input id="p-ph" dir="ltr" value="${esc(a.phone || '')}"></label>

&#x20;   <label class="f" style="grid-column:1/-1">ایمیل<input id="p-e" dir="ltr" type="email" value="${esc(a.email || '')}"></label>

&#x20;   <h2 style="grid-column:1/-1;margin:12px 0 0">نام کاربری و رمز</h2>

&#x20;   <label class="f">نام کاربری<input id="p-u" dir="ltr" value="${esc(a.username)}"></label>

&#x20;   <label class="f">رمز فعلی (برای تغییر نام کاربری/رمز)<input id="p-c" dir="ltr" type="password" autocomplete="current-password"></label>

&#x20;   <label class="f">رمز جدید<input id="p-np" dir="ltr" type="password" autocomplete="new-password"></label>

&#x20;   <label class="f">تکرار رمز جدید<input id="p-np2" dir="ltr" type="password" autocomplete="new-password"></label>

&#x20;   <div style="grid-column:1/-1"><button class="btn sf">ذخیره</button></div>

&#x20; </form>`;

&#x20; $('#pf2').addEventListener('submit', async e => {

&#x20;   e.preventDefault();

&#x20;   if ($('#p-np').value !== $('#p-np2').value) { toast('تکرار رمز جدید یکسان نیست', true); return; }

&#x20;   try {

&#x20;     S.me = await T('app\_update\_profile', { p\_full\_name: $('#p-n').value, p\_phone: $('#p-ph').value, p\_email: $('#p-e').value,

&#x20;       p\_username: $('#p-u').value, p\_current\_password: $('#p-c').value || null, p\_new\_password: $('#p-np').value || null });

&#x20;     localStorage.setItem('bm\_me', JSON.stringify(S.me)); toast('پروفایل ذخیره شد'); renderShell();

&#x20;   } catch (err) { toast(err.message, true); }

&#x20; });

}



// =====================================================================

S.token ? renderShell() : renderLogin();

</script>





</body></html>
