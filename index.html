<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مدیریت ساختمان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --tile: #004759; --tile-2: #006289; --saffron: #e84a00; --brick: #bb1d2c; --plum: #661f66;
      --paper: #fbf8f5; --card: #ffffff; --line: #e9e1da; --ink: #2b2420; --muted: #7a6c63;
      --ok: #0f7a5a; --ok-bg: #e3f4ed; --warn: #b54700; --warn-bg: #fdeee4; --bad: #bb1d2c; --bad-bg: #fbe6e8;
      --r: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: Vazirmatn, Tahoma, sans-serif; font-size: 15px; line-height: 1.7; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: var(--tile-2); }
    .hidden { display: none !important; }
    header.top { background: var(--tile); color: #fff; position: sticky; top: 0; z-index: 20; }
    .top-in { max-width: 1180px; margin: auto; display: flex; align-items: center; gap: 16px; padding: 12px 20px; flex-wrap: wrap; }
    .brand { font-weight: 900; font-size: 20px; display: flex; align-items: center; gap: 10px; }
    .brand i { width: 12px; height: 28px; background: var(--saffron); border-radius: 3px; display: inline-block; }
    nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
    nav.tabs button { background: transparent; border: 0; color: #cfe3e8; padding: 7px 14px; border-radius: 99px; cursor: pointer; font-weight: 500; }
    nav.tabs button.on { background: #fff; color: var(--tile); font-weight: 700; }
    .who { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #cfe3e8; }
    .who b { color: #fff; }
    .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 99px; padding: 5px 14px; cursor: pointer; }
    main { max-width: 1180px; margin: auto; padding: 24px 20px 80px; }
    h1 { font-size: 30px; font-weight: 900; margin: 0 0 4px; }
    h2 { font-size: 20px; font-weight: 700; margin: 0 0 12px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .spread { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
    .grid { display: grid; gap: 16px; }
    .g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .g3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    label.f { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
    input, select, textarea { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 12px; min-height: 42px; width: 100%; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--tile-2); outline-offset: -1px; border-color: transparent; }
    .btn { border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; font-weight: 700; background: var(--tile); color: #fff; min-height: 42px; white-space: nowrap; }
    .btn:hover { background: var(--tile-2); }
    .btn.sf { background: var(--saffron); }
    .btn.lt { background: #eef3f4; color: var(--tile); }
    .btn.rd { background: var(--bad-bg); color: var(--bad); }
    .btn.sm { padding: 5px 12px; min-height: 32px; font-size: 14px; border-radius: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; padding: 1px 10px; font-size: 14px; font-weight: 700; }
    .chip.ok { background: var(--ok-bg); color: var(--ok); }
    .chip.no { background: var(--warn-bg); color: var(--warn); }
    .chip.ex { background: #efeae6; color: var(--muted); }
    .chip.pd { background: #ece4f3; color: var(--plum); }
    .num { font-feature-settings: "tnum"; white-space: nowrap; }
    .neg { color: var(--bad); }
    .muted { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { font-weight: 700; color: var(--muted); text-align: right; padding: 10px 8px; border-bottom: 2px solid var(--line); background: var(--card); }
    td { padding: 9px 8px; border-bottom: 1px solid var(--line); }
    .tbl-wrap { overflow: auto; max-height: 70vh; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 12px; opacity: 0; transition: .25s; z-index: 99; }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { background: var(--bad); }
    .login { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
    .login .art { background: var(--tile); padding: 48px; color: #fff; display: flex; align-items: flex-end; position: relative; }
    .login .form { display: flex; align-items: center; justify-content: center; padding: 32px; }
    .login .form .card { width: 100%; max-width: 400px; padding: 32px; }
    .banner { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-weight: 500; }
    @media(max-width: 820px) { .login { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast"></div>
  <script>
    const SUPABASE_URL = 'https://hpgvgoehkcpjmdbfmnse.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_BuJxTaMP2rYWTe5mh-N55Q_gSHE1O8g';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

    const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
    const CATS = { charge:'شارژ ماهیانه', water:'قبض آب', gas:'قبض گاز', repair:'بازسازی', parking:'اجاره پارکینگ', debt:'پرداخت بدهی معوق', other:'سایر', bill:'کل صورتحساب ماه' };
    const OCC = ['مالک ساکن','مالک','مستأجر'];
    const $ = (s, el = document) => el.querySelector(s); const $$ = (s, el = document) => [...el.querySelectorAll(s)];
    const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const fmt = n => new Intl.NumberFormat('fa-IR').format(Math.round(Number(n) || 0));
    const money = n => `<span class="num ${Number(n) < 0 ? 'neg' : ''}">${fmt(n)}</span>`;
    const fa = v => String(v || '');
    const toNum = v => Number(String(v || '').replace(/[^\d.-]/g, '')) || 0;

    function jalaliToday() { 
      return { y: 1405, m: 7, d: 15 };
    }
    const TODAY = jalaliToday();

    function toast(msg, err = false) { 
      const t = $('#toast'); 
      t.textContent = msg; t.className = 'toast on' + (err ? ' err' : ''); 
      clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 3200);
    }

    const S = { token: localStorage.getItem('bm_token'), me: JSON.parse(localStorage.getItem('bm_me') || 'null'), view: 'dash', y: TODAY.y, m: TODAY.m, building: 'ساختمان' };

    async function api(fn, args = {}) { 
      const { data, error } = await sb.rpc(fn, args); 
      if (error) { 
        const msg = (error.message || '').replace(/^AUTH_REQUIRED:\s*/, ''); 
        if ((error.message || '').startsWith('AUTH_REQUIRED')) { logout(true); } 
        throw new Error(msg || 'خطا در ارتباط با سرور'); 
      } 
      return data;
    }
    const T = (fn, args = {}) => api(fn, { p_token: S.token, ...args });

    async function renderLogin() { 
      document.title = 'ورود | مدیریت ساختمان'; 
      $('#app').innerHTML = ` 
      <div class="login"> 
        <div class="art"><div><h1 id="lg-name">ساختمان</h1><p>مدیریت صندوق و واحدها</p></div></div> 
        <div class="form"><div class="card"> 
          <h2>ورود ساکنین</h2> 
          <form id="lg" class="grid" style="gap:14px"> 
            <label class="f">واحد <select id="lg-acc"><option value="">در حال بارگذاری…</option></select></label> 
            <label class="f">یا نام کاربری <input id="lg-user" autocomplete="username" dir="ltr"></label> 
            <label class="f">رمز عبور <input id="lg-pass" type="password" autocomplete="current-password" dir="ltr" required></label> 
            <button class="btn sf" type="submit">ورود</button> 
            <p id="lg-err" class="neg" style="margin:0;min-height:1.7em"></p> 
          </form> 
        </div></div> 
      </div>`; 
      try { 
        const info = await api('app_public_info'); 
        S.building = info.building_name; 
        $('#lg-name').textContent = info.building_name; 
        $('#lg-acc').innerHTML = `<option value="">انتخاب واحد…</option>` + info.accounts.map(a => 
          `<option value="${a.id}">واحد ${a.unit_no} · ${esc(a.full_name || '')} (${esc(a.occupancy)})${a.is_admin ? ' · مدیر' : ''}</option>`).join(''); 
      } catch (e) {} 
      $('#lg-acc').addEventListener('change', () => { if ($('#lg-acc').value) $('#lg-user').value = ''; }); 
      $('#lg-user').addEventListener('input', () => { if ($('#lg-user').value) $('#lg-acc').value = ''; }); 
      $('#lg').addEventListener('submit', async e => { 
        e.preventDefault(); 
        const login = $('#lg-user').value.trim() \vert{}\vert{} $('#lg-acc').value; 
        if (!login) { $('#lg-err').textContent = 'واحد یا نام کاربری را وارد کنید'; return; } 
        try { 
          const r = await api('app_login', { p_login: login, p_password: $('#lg-pass').value }); 
          if (!r.ok) { $('#lg-err').textContent = r.error; return; } 
          S.token = r.token; S.me = r.account; 
          localStorage.setItem('bm_token', S.token); localStorage.setItem('bm_me', JSON.stringify(S.me)); 
          renderShell(); 
        } catch (err) { $('#lg-err').textContent = err.message; } 
      });
    }

    async function logout(silent = false) { 
      if (S.token && !silent) { try { await api('app_logout', { p_token: S.token }); } catch (e) {} } 
      S.token = null; S.me = null; 
      localStorage.removeItem('bm_token'); localStorage.removeItem('bm_me'); 
      renderLogin();
    }

    async function renderShell() { 
      try { S.me = await T('app_me'); localStorage.setItem('bm_me', JSON.stringify(S.me)); } 
      catch (e) { if (S.token) { logout(true); return; } } 
      document.title = S.building + ' | مدیریت ساختمان'; 
      $('#app').innerHTML = ` 
      <header class="top"><div class="top-in"> 
        <div class="brand"><i></i>${esc(S.building)}</div> 
        <nav class="tabs"> 
          <button data-v="dash" class="on">داشبورد</button> 
          <button data-v="tx">تراکنش‌ها</button> 
          <button data-v="report">گزارش ماهانه</button> 
          ${S.me?.is_admin ? '<button data-v="units">واحدها</button><button data-v="rates">نرخ‌ها</button>' : ''} 
        </nav> 
        <div class="who"><span>واحد ${S.me.unit_no} · <b>${esc(S.me.full_name || S.me.username)}</b></span> 
          <button class="btn-ghost" id="lo">خروج</button></div> 
      </div></header> 
      <main id="view"></main>`; 
      $$('nav.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));$('#lo').addEventListener('click', () => logout()); 
      go('dash');
    }

    async function go(v) { 
      const el = $('#view'); el.innerHTML = `<p class="muted">در حال بارگذاری…</p>`; 
      try { 
        if (v === 'dash') await viewDash(el); 
        else if (v === 'tx') await viewTx(el); 
        else if (v === 'report') await viewReport(el); 
        else if (v === 'units' && S.me.is_admin) await viewUnits(el); 
        else if (v === 'rates' && S.me.is_admin) await viewRates(el); 
      } catch (e) { el.innerHTML = `<div class="banner">${esc(e.message)}</div>`; } 
    }

    async function viewDash(el) { 
      const rep = await T('app_report', { p_year: S.y, p_month: S.m }); 
      el.innerHTML = `<h1>داشبورد</h1><p class="sub">${rep.month_name} ${rep.year}</p><div class="card"><p>خوش آمدید! سیستم با موفقیت متصل شد.</p></div>`; 
    }
    async function viewTx(el) { el.innerHTML = `<h1>تراکنش‌ها</h1>`; }
    async function viewReport(el) { el.innerHTML = `<h1>گزارش</h1>`; }
    async function viewUnits(el) { el.innerHTML = `<h1>واحدها</h1>`; }
    async function viewRates(el) { el.innerHTML = `<h1>نرخ‌ها</h1>`; }

    if (S.token && S.me) renderShell(); else renderLogin();
  </script>
</body>
</html>
