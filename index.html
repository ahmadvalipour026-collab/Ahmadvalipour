<html lang="fa" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت ساختمان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --tile:#004759; --tile-2:#006289; --saffron:#e84a00; --brick:#bb1d2c; --plum:#661f66;
  --paper:#fbf8f5; --card:#ffffff; --line:#e9e1da; --ink:#2b2420; --muted:#7a6c63;
  --ok:#0f7a5a; --ok-bg:#e3f4ed; --warn:#b54700; --warn-bg:#fdeee4; --bad:#bb1d2c; --bad-bg:#fbe6e8;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:15px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--tile-2)}
.hidden{display:none!important}
/* ---------- top ---------- */
header.top{background:var(--tile);color:#fff;position:sticky;top:0;z-index:20;
  background-image:radial-gradient(circle at 12px 12px,rgba(255,255,255,.07) 2px,transparent 3px);background-size:24px 24px}
.top-in{max-width:1180px;margin:auto;display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
.brand{font-weight:900;font-size:20px;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.brand i{width:12px;height:28px;background:var(--saffron);border-radius:3px;display:inline-block}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav.tabs button{background:transparent;border:0;color:#cfe3e8;padding:7px 14px;border-radius:99px;cursor:pointer;font-weight:500}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.08)}
nav.tabs button.on{background:#fff;color:var(--tile);font-weight:700}
.who{display:flex;align-items:center;gap:10px;font-size:14px;color:#cfe3e8}
.who b{color:#fff}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:99px;padding:5px 14px;cursor:pointer}
main{max-width:1180px;margin:auto;padding:24px 20px 80px}
/* ---------- basics ---------- */
h1{font-size:30px;font-weight:900;margin:0 0 4px;letter-spacing:-.5px}
h2{font-size:20px;font-weight:700;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);min-width:0}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;min-height:42px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--tile-2);outline-offset:-1px;border-color:transparent}
/* ---------- buttons (smaller + 3D) ---------- */
.btn{
  border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:700;
  font-size:13.5px;line-height:1.2;min-height:36px;white-space:nowrap;
  background:var(--tile);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -2px 0 rgba(0,0,0,.22), 0 2px 3px rgba(0,0,0,.14);
  transition:transform .08s ease, box-shadow .08s ease, background .15s;
  transform:translateY(-1px);
}
.btn:hover{background:var(--tile-2);transform:translateY(0);box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -2px 0 rgba(0,0,0,.22), 0 1px 2px rgba(0,0,0,.14)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
.btn.sf{background:var(--saffron);box-shadow:inset 0 1px 0 rgba(255,255,255,.25), inset 0 -2px 0 rgba(0,0,0,.22), 0 2px 3px rgba(0,0,0,.14)}
.btn.sf:hover{background:#c93f00}
.btn.lt{background:#eef3f4;color:var(--tile);box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 0 rgba(0,0,0,.06), 0 2px 3px rgba(0,0,0,.08)}
.btn.lt:hover{background:#e0eaec}
.btn.rd{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 0 rgba(0,0,0,.06), 0 2px 3px rgba(0,0,0,.08)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:12.5px;border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -2px 0 rgba(0,0,0,.22), 0 1px 2px rgba(0,0,0,.12);transform:translateY(-1px)}
.btn.sm:hover{transform:translateY(0)}
.btn.sm:active{transform:translateY(1px);box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:1px 10px;font-size:14px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.no{background:var(--warn-bg);color:var(--warn)}
.chip.ex{background:#efeae6;color:var(--muted)}
.chip.pd{background:#ece4f3;color:var(--plum)}
.num{font-feature-settings:"tnum";white-space:nowrap}
.neg{color:var(--bad)}
.muted{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:700;color:var(--muted);text-align:right;padding:10px 8px;border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#fcfaf8}
.tbl-wrap{overflow:auto;max-height:70vh;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;opacity:0;transition:.25s;z-index:99;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--bad)}
/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .art{background:var(--tile);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:48px;color:#fff}
.login .art h1{font-size:56px;line-height:1.15;position:relative;z-index:2}
.login .art p{color:#cfe3e8;position:relative;z-index:2;margin:8px 0 0}
.login .form{display:flex;align-items:center;justify-content:center;padding:32px}
.login .form .card{width:100%;max-width:400px;padding:32px}
@media(max-width:820px){.login{grid-template-columns:1fr}.login .art{min-height:300px;padding:28px}.login .art h1{font-size:38px}}
/* ---------- facade (signature) ---------- */
.facade{background:linear-gradient(#f3ebe4,#efe5dc);border-radius:var(--r);padding:28px 28px 0;border:1px solid var(--line);position:relative}
.roof{height:14px;background:var(--brick);border-radius:6px 6px 0 0;margin:0 -10px}
.tower{background:#c9b5a5;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;
  background-image:linear-gradient(90deg,rgba(0,0,0,.05) 1px,transparent 1px),linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:22px 11px}
.win{border:0;cursor:pointer;border-radius:10px 10px 4px 4px;padding:12px 14px;text-align:right;color:#fff;background:var(--tile-2);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);transition:transform .15s;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.win:hover{transform:translateY(-2px)}
.win .u{font-weight:900;font-size:18px}
.win .n{font-size:14px;opacity:.85}
.win .d{font-weight:700;font-size:15px}
.win.clear{background:var(--ok)}
.win.owe{background:var(--saffron)}
.win.heavy{background:var(--brick)}
.win.me{outline:3px solid var(--ink);outline-offset:2px}
.ground{height:34px;background:#8d7666;margin:0 -10px;border-radius:0 0 8px 8px;display:flex;justify-content:center}
.ground span{width:64px;background:var(--tile);border-radius:6px 6px 0 0;margin-top:2px}
.legend{display:flex;gap:14px;font-size:14px;color:var(--muted);margin:12px 0 18px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:6px;vertical-align:-1px}
/* ---------- bill ---------- */
.bill{padding:0;overflow:hidden}
.bill-head{background:var(--tile);color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.bill-head .big{font-size:40px;font-weight:900;line-height:1}
.bill-lines{padding:8px 24px}
.bill-line{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line);gap:12px}
.bill-line:last-child{border:0}
.bill-foot{background:#f6f1ec;padding:16px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kv small{display:block;color:var(--muted);font-size:14px}
.kv b{font-size:20px}
.stat{padding:18px}
.stat small{color:var(--muted);display:block}
.stat b{font-size:26px;font-weight:900}
.hero-balance{background:var(--saffron);color:#fff;border:0}
.hero-balance small{color:#ffe1d1}
.hero-balance b{font-size:38px}
/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(30,20,15,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:720px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.modal .x{float:left;background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted)}
.acc{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.checks{display:flex;gap:14px;flex-wrap:wrap}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.checks input{width:auto;min-height:0}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-weight:500}
@media print{header.top,.no-print{display:none!important}main{padding:0}.tbl-wrap{max-height:none;overflow:visible;border:0}body{background:#fff}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
// =====================================================================
//  تنظیمات Supabase
// =====================================================================
const SUPABASE_URL = 'https://hpgvgoehkcpjmdbfmnse.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BuJxTaMP2rYWTe5mh-N55Q_gSHE1O8g';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
// =====================================================================
//  کمکی‌ها
// =====================================================================
const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
// ★ اضافه شد: قبض برق
const CATS = { charge:'شارژ ماهیانه', water:'قبض آب', gas:'قبض گاز', electric:'قبض برق', repair:'بازسازی', parking:'اجاره پارکینگ', debt:'پرداخت بدهی معوق', other:'سایر', bill:'کل صورتحساب ماه' };
const OCC = ['مالک ساکن','مالک','مستأجر'];
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('fa-IR').format(Math.round(Number(n) || 0));
const money = n => `<span class="num ${Number(n) < 0 ? 'neg' : ''}">${fmt(n)}</span>`;
const fa = v => String(v ?? '').replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const toNum = v => Number(String(v ?? '').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d.-]/g, '')) || 0;
function jalaliToday() {
  const p = new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn', { year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(new Date());
  const g = t => Number(p.find(x => x.type === t)?.value);
  return { y: g('year'), m: g('month'), d: g('day') };
}
const TODAY = jalaliToday();
function toast(msg, err = false) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 3200);
}
const S = {
  token: localStorage.getItem('bm_token'),
  me: JSON.parse(localStorage.getItem('bm_me') || 'null'),
  view: 'dash', y: TODAY.y, m: TODAY.m, building: 'ساختمان',
};
async function api(fn, args = {}) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) {
    const msg = (error.message || '').replace(/^AUTH_REQUIRED:\s*/, '');
    if ((error.message || '').startsWith('AUTH_REQUIRED')) { logout(true); }
    throw new Error(msg || 'خطا در ارتباط با سرور');
  }
  return data;
}
const T = (fn, args = {}) => api(fn, { p_token: S.token, ...args });
function smsLink(phone, text) {
  if (!phone) return '';
  const sep = /iPhone|iPad|iPod/.test(navigator.userAgent) ? '&' : '?';
  return `sms:${phone}${sep}body=${encodeURIComponent(text)}`;
}
function smsBtn(phone, text, label = 'پیامک') {
  if (!phone) return `<span class="muted" title="شماره ثبت نشده">—</span>`;
  return `<a class="btn lt sm" href="${smsLink(phone, text)}">✉ ${label}</a>`;
}
function yearOptions(sel) {
  const ys = []; for (let y = TODAY.y + 1; y >= 1403; y--) ys.push(y);
  return ys.map(y => `<option value="${y}" ${y == sel ? 'selected' : ''}>${fa(y)}</option>`).join('');
}
const monthOptions = (sel, withAll = false) =>
  (withAll ? `<option value="">همه ماه‌ها</option>` : '') +
  MONTHS.map((n, i) => `<option value="${i + 1}" ${i + 1 == sel ? 'selected' : ''}>${n}</option>`).join('');
const unitOptions = (sel, withBuilding = true, withAll = false) =>
  (withAll ? `<option value="">همه</option>` : '') +
  (withBuilding ? `<option value="0" ${sel === 0 || sel === '0' ? 'selected' : ''}>ساختمان</option>` : '') +
  Array.from({ length: 10 }, (_, i) => `<option value="${i + 1}" ${sel == i + 1 ? 'selected' : ''}>واحد ${fa(i + 1)}</option>`).join('');
function periodPicker() {
  return `<div class="row no-print">
    <select id="pk-m" style="width:auto">${monthOptions(S.m)}</select>
    <select id="pk-y" style="width:auto">${yearOptions(S.y)}</select></div>`;
}
function bindPeriod(cb) {
  $('#pk-m')?.addEventListener('change', e => { S.m = +e.target.value; cb(); });
  $('#pk-y')?.addEventListener('change', e => { S.y = +e.target.value; cb(); });
}
function modal(html) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><button class="x" aria-label="بستن">×</button>${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.classList.contains('x')) bg.remove(); });
  document.body.appendChild(bg);
  return bg;
}
// =====================================================================
//  ورود
// =====================================================================
async function renderLogin() {
  document.title = 'ورود | مدیریت ساختمان';
  $('#app').innerHTML = `
  <div class="login">
    <div class="art">
      <svg viewBox="0 0 400 400" style="position:absolute;inset:0;width:100%;height:100%;opacity:.16" preserveAspectRatio="xMidYMid slice">
        <defs><pattern id="tl" width="80" height="80" patternUnits="userSpaceOnUse">
          <path d="M40 0 L80 40 L40 80 L0 40Z" fill="none" stroke="#fff" stroke-width="2"/>
          <circle cx="40" cy="40" r="10" fill="none" stroke="#e84a00" stroke-width="3"/></pattern></defs>
        <rect width="400" height="400" fill="url(#tl)"/></svg>
      <div><h1 id="lg-name">ساختمان</h1><p>.</p></div>
    </div>
    <div class="form"><div class="card">
      <h2>ورود ساکنین</h2>
          <select id="lg-acc"><option value="">در حال بارگذاری…</option></select></label>
        <label class="f">یا نام کاربری
          <input id="lg-user" autocomplete="username" placeholder="مثلاً negin1" dir="ltr"></label>
        <label class="f">رمز عبور
          <input id="lg-pass" type="password" autocomplete="current-password" dir="ltr" required></label>
        <button class="btn sf" type="submit">ورود</button>
        <p id="lg-err" class="neg" style="margin:0;min-height:1.7em"></p>
      </form>
    </div></div>
  </div>`;
  try {
    const info = await api('app_public_info');
    S.building = info.building_name;
    $('#lg-name').textContent = info.building_name;
    const login = $('#lg-user').value.trim() || $('#lg-acc').value;
    if (!login) { $('#lg-err').textContent = 'واحد یا نام کاربری را وارد کنید'; return; }
    try {
      const r = await api('app_login', { p_login: login, p_password: $('#lg-pass').value });
      if (!r.ok) { $('#lg-err').textContent = r.error; return; }
      S.token = r.token; S.me = r.account;
      localStorage.setItem('bm_token', S.token); localStorage.setItem('bm_me', JSON.stringify(S.me));
      S.view = 'dash'; renderShell();
    } catch (err) { $('#lg-err').textContent = err.message; }
  });
}
async function logout(silent = false) {
  if (S.token && !silent) { try { await api('app_logout', { p_token: S.token }); } catch (e) {} }
  S.token = null; S.me = null;
  localStorage.removeItem('bm_token'); localStorage.removeItem('bm_me');
  renderLogin();
}
// =====================================================================
//  قالب اصلی
// =====================================================================
function tabs() {
  const a = S.me?.is_admin;
  return [
    ['dash', 'داشبورد'],
    a && ['units', 'واحدها'],
    ['tx', 'تراکنش‌ها'],
    ['pay', a ? 'تایید پرداخت‌ها' : 'پرداخت بدهی'],
    ['report', 'گزارش ماهانه'],
    a && ['rates', 'نرخ‌ها و تنظیمات'],
    ['profile', 'پروفایل'],
  ].filter(Boolean);
}
async function renderShell() {
  try { S.me = await T('app_me'); localStorage.setItem('bm_me', JSON.stringify(S.me)); }
  catch (e) { if (S.token) { $('#app').innerHTML = `<main><div class="banner">${esc(e.message)}</div><button class="btn" onclick="logout(true)">ورود مجدد</button></main>`; } return; }
  try { const info = await api('app_public_info'); S.building = info.building_name; } catch (e) {}
  document.title = S.building + ' | مدیریت ساختمان';
  $('#app').innerHTML = `
  <header class="top"><div class="top-in">
    <div class="brand"><i></i>${esc(S.building)}</div>
    <nav class="tabs">${tabs().map(([k, l]) => `<button data-v="${k}" class="${S.view === k ? 'on' : ''}">${l}</button>`).join('')}</nav>
    <div class="who"><span>واحد ${fa(S.me.unit_no)} · <b>${esc(S.me.full_name || S.me.username)}</b>${S.me.is_admin ? ' (مدیر)' : ''}</span>
      <button class="btn-ghost" id="lo">خروج</button></div>
  </div></header>
  <main id="view"></main>`;
  $$('nav.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
  $('#lo').addEventListener('click', () => logout());
  go(S.view);
}
function go(v) {
  S.view = v;
  $$('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  const map = { dash: viewDash, units: viewUnits, tx: viewTx, pay: viewPay, report: viewReport, rates: viewRates, profile: viewProfile };
  const el = $('#view');
  el.innerHTML = `<p class="muted">در حال بارگذاری…</p>`;
  (map[v] || viewDash)(el).catch(e => { el.innerHTML = `<div class="banner">${esc(e.message)}</div>`; });
}
const mustChangeBanner = () => S.me?.must_change_password
  ? `<div class="banner">رمز عبور شما هنوز پیش‌فرض است. از بخش <a href="#" onclick="go('profile');return false">پروفایل</a> آن را تغییر دهید.</div>` : '';
// =====================================================================
//  داشبورد
// =====================================================================
function billCard(r, rep) {
  const line = (label, amt, ok, extra = '') => `
    <div class="bill-line"><span>${label} ${extra}</span>
      <span class="row" style="gap:10px">${money(amt)} ${ok === null ? '<span class="chip ex">معاف</span>' : ok ? '<span class="chip ok">✓ پرداخت شده</span>' : '<span class="chip no">پرداخت نشده</span>'}</span></div>`;
  return `<div class="card bill">
    <div class="bill-head"><div><div class="muted" style="color:#cfe3e8">صورتحساب ${rep.month_name} ${fa(rep.year)} · واحد ${fa(r.unit_no)}</div>
      <div style="font-weight:700">${esc(r.full_name || '')} · ${fa(r.persons)} نفر</div></div>

  $('#ap-a', m).addEventListener('input', e => { const n = toNum(e.target.value); e.target.value = n ? fmt(n) : ''; });

        $('#ap-f', m).addEventListener('click', () => run(true)); return;
      }
      const total = r.transactions.reduce((s, t) => s + t.amount, 0);
      const txt = `${S.building} - واحد ${p.unit_no}\nپرداخت ${fmt(total)} تومان بابت ${r.transactions.map(t => t.description).join('، ')} (${MONTHS[p.month - 1]} ${p.year}) تایید و ثبت شد. سپاس`;

        <div class="row" style="margin-top:10px">${smsBtn(r.phone, txt, 'ارسال پیامک تایید به ساکن')}</div></div>`;

      m.addEventListener('click', e => { if (e.target === m || e.target.classList.contains('x')) go('pay'); });
    } catch (e) { toast(e.message, true); }
  };
  $('#ap-go', m).addEventListener('click', () => run(false));
}

      <label class="f">محل<input id="t-loc" value="${esc(t.location || '')}" placeholder="خودکار از دسته"></label>
      <label class="f">شرح<input id="t-desc" value="${esc(t.description || '')}" placeholder="خودکار از دسته"></label>
      <label class="f">مبلغ (تومان)<input id="t-amt" inputmode="numeric" required value="${t.amount ? fmt(t.amount) : ''}"></label>
      <div style="grid-column:1/-1" class="row"><button class="btn sf">${isNew ? 'ثبت' : 'ذخیره'}</button><span id="t-out"></span></div>
    </form>`);
  $('#t-amt', m).addEventListener('input', e => { const n = toNum(e.target.value); e.target.value = n ? fmt(n) : ''; });
  const run = async (force) => {
    const unit = +$('#t-unit', m).value;
    try {
      const r = await T('app_admin_save_transaction', { p_id: isNew ? null : t.id, p_year: +$('#t-y', m).value, p_month: +$('#t-m', m).value, p_day: +$('#t-d', m).value || 1,
        p_unit_no: unit || null, p_tx_type: $('#t-type', m).value, p_category: $('#t-cat', m).value, p_location: $('#t-loc', m).value, p_description: $('#t-desc', m).value,
        p_amount: toNum($('#t-amt', m).value), p_force: force });
      if (!r.ok && r.duplicate) {
        $('#t-out', m).innerHTML = `<span class="neg">${esc(r.error)}</span> <button type="button" class="btn sm lt" id="t-f">ثبت اجباری</button>`;
        $('#t-f', m).addEventListener('click', () => run(true)); return;
      }
      const x = r.transaction;
      toast('ثبت شد');
      if (x.unit_no && r.phone) {
        $('#tf', m).innerHTML = `<div style="grid-column:1/-1" class="card"><b>تراکنش ثبت شد.</b><div class="row" style="margin-top:10px">
          ${smsBtn(r.phone, `${S.building} - واحد ${x.unit_no}\n${x.tx_type === 'درآمد' ? 'دریافت' : 'ثبت'} ${fmt(x.amount)} تومان بابت ${x.description} (${x.month_name} ${x.year}) ثبت شد.`, 'ارسال پیامک به ساکن')}
          <button type="button" class="btn lt sm" id="t-close">بستن</button></div></div>`;
        $('#t-close', m).addEventListener('click', () => { m.remove(); go('tx'); });
      } else { m.remove(); go('tx'); }
    } catch (e) { toast(e.message, true); }
  };
  $('#tf', m).addEventListener('submit', e => { e.preventDefault(); run(false); });
}
function exportCsv(rows) {
  const head = ['data', 'Year', 'Month', 'ماه', 'واحد', 'نوع', 'محل', 'شرح', 'مبلغ', 'نوع سکونت'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [head.map(q).join(',')].concat(rows.slice().reverse().map(t =>
    [t.tx_date, t.year, t.month, t.month_name, t.unit_no ? 'واحد ' + t.unit_no : 'ساختمان', t.tx_type, t.location, t.description, t.amount, t.occupancy].map(q).join(',')));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Table2.csv'; a.click();
}

function unitModal(u) {
  const m = modal(`<h2>واحد ${fa(u.unit_no)}</h2>
    <form id="uf" class="grid g3">
      <label class="f">تعداد نفرات<input id="u-p" type="number" min="0" value="${u.persons}"></label>

      <div class="checks" style="grid-column:1/-1"><label><input type="checkbox" id="u-pk" ${u.has_parking ? 'checked' : ''}>اجاره پارکینگ دارد</label></div>
      <div style="grid-column:1/-1"><span class="muted">معافیت‌ها</span><div class="checks">
        ${['charge', 'water', 'gas', 'electric', 'repair', 'parking'].map(c => `<label><input type="checkbox" value="${c}" class="u-ex" ${u.exemptions.includes(c) ? 'checked' : ''}>${CATS[c]}</label>`).join('')}</div></div>
      <label class="f" style="grid-column:1/-1">یادداشت<input id="u-n" value="${esc(u.notes || '')}"></label>
      <div style="grid-column:1/-1"><button class="btn sf">ذخیره واحد</button></div>
    </form>
    <h2 style="margin-top:24px">حساب‌های کاربری</h2>
    <div id="accs">${u.accounts.map(a => accForm(a, u.unit_no)).join('')}</div>
    <button class="btn lt sm" id="add-acc" style="margin-top:12px">+ حساب جدید (مثلاً مستأجر)</button>`);
  $('#uf', m).addEventListener('submit', async e => {
    e.preventDefault();
    try {
      await T('app_admin_save_unit', { p_unit_no: u.unit_no, p_persons: +$('#u-p', m).value, p_area: $('#u-a', m).value ? +$('#u-a', m).value : null,
        p_occupancy: $('#u-o', m).value, p_has_parking: $('#u-pk', m).checked, p_notes: $('#u-n', m).value, p_exemptions: $$('.u-ex', m).filter(x => x.checked).map(x => x.value) });
      toast('واحد ذخیره شد');
    } catch (err) { toast(err.message, true); }
  });
  const bindAcc = f => f.addEventListener('submit', async e => {
    e.preventDefault();
    const v = n => f.elements[n].value;
    try {
      const a = await T('app_admin_save_account', { p_id: f.dataset.id || null, p_unit_no: u.unit_no, p_username: v('username'), p_full_name: v('full_name'),
        p_phone: v('phone'), p_email: v('email'), p_occupancy: v('occupancy'), p_is_primary: f.elements.is_primary.checked,
        p_is_active: f.elements.is_active.checked, p_new_password: v('pass') || null });
      f.dataset.id = a.id; f.elements.pass.value = ''; toast('حساب ذخیره شد');
    } catch (err) { toast(err.message, true); }
  });
  $$('form.acc', m).forEach(bindAcc);
  $('#add-acc', m).addEventListener('click', () => {
    $('#accs', m).insertAdjacentHTML('beforeend', accForm(null, u.unit_no));
    bindAcc($$('form.acc', m).pop());
  });
  m.addEventListener('click', e => { if (e.target === m || e.target.classList.contains('x')) go('units'); });
}
